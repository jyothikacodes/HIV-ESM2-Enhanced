name: hiv-esm2
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pytorch=2.12.0
  - torchvision
  - torchaudio
  - cudatoolkit=11.8
  - pandas=3.0.0
  - numpy=2.4.0
  - scikit-learn=1.8.0
  - scipy=1.17.0
  - matplotlib=3.10.9
  - seaborn=0.13.2
  - openpyxl=3.1.5
  - biopython=1.87
  - tqdm=4.67.1
  - jupyter=1.1.1
  - ipywidgets=8.1.8
  - ipykernel=7.2.0
  - pip
  - pip:
    - fair-esm==2.0.0
    - xgboost==3.2.0
    - shap==0.51.0
# Note: optuna>=3.0.0, lightgbm>=4.0.0, and esm>=3.0.0 are optional and have been omitted to prevent conflicts/bloat.
